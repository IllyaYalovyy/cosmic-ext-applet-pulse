name: Test, package and publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel earlier pushes: each commit needs its own artifacts.
concurrency:
  group: pulse-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  workflow-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Install build and validation tools
        run: |
          dnf install -y git gcc gcc-c++ curl python3 tar gzip findutils \
            rpm-build rpm-build-libs cpio binutils pkgconf-pkg-config \
            wayland-devel libxkbcommon-devel systemd-devel libinput-devel \
            libseat-devel mesa-libEGL-devel fontconfig-devel dbus-devel \
            desktop-file-utils appstream
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Trust the mounted checkout in the build container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0 --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora45-rust1.99-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            fedora45-rust1.99-${{ hashFiles('Cargo.lock') }}-
            fedora45-rust1.99-
      - name: Read package version
        id: version
        run: python3 -c 'import os, tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Build RPM and run quality gate
        shell: bash
        run: |
          export PULSE_RPM_RELEASE="0.${GITHUB_RUN_NUMBER}.git${GITHUB_SHA:0:12}"
          ./scripts/build-release.sh
      - name: Run all headless tests in debug and release profiles
        run: ./scripts/ci-checks.sh
      - name: Verify RPM and sample with the packaged executable
        run: ./scripts/verify-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-fedora45-x86_64-${{ github.sha }}
          path: dist/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload graph previews even if a later check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-previews-${{ github.sha }}
          path: target/graph-preview/*.svg
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [workflow-check, fedora]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-fedora45-x86_64-${{ github.sha }}
          path: artifacts
      - name: Verify and publish commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS
          tag="ci-$COMMIT"
          # Reruns leave an already published snapshot intact.
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/is-draft; then
            if [[ $(cat /tmp/is-draft) == false ]]; then exit 0; fi
            gh release upload "$tag" ./* --clobber
          else
            printf 'Automated Fedora 45 x86_64 build of commit %s.\n\nAll headless checks passed. Hardware GPU and COSMIC panel testing remain manual.\n\nUnsigned upstream RPM; includes sources, dependency sources, previews, smoke-test output and SHA-256 checksums.\n' "$COMMIT" > /tmp/notes.md
            gh release create "$tag" ./* --target "$COMMIT" --draft --prerelease \
              --title "Pulse snapshot ${COMMIT:0:12}" --notes-file /tmp/notes.md
          fi
          # Drafts without a published tag are found through the releases list.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\")" > /tmp/uploaded.json
          python3 - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path('/tmp/uploaded.json').read_text())
          files = {p.name: p for p in Path('.').iterdir() if p.is_file()}
          assert set(files) == {a['name'] for a in release['assets']}
          for asset in release['assets']:
              path = files[asset['name']]
              assert asset['state'] == 'uploaded'
              assert asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PYVERIFY
          gh release edit "$tag" --draft=false --prerelease --latest=false
